{% extends "base.html" %}

{% block content %}
<h1 class="text-3xl text-sky-500 font-bold underline">
  {{ message }}
</h1>

<h2>Test Alpine.js</h2>
<div x-data="{ count: 0 }">
  <button x-on:click="count++"
    class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Increment</button>

  <span x-text="count"></span>
</div>


<h2>Test htmx</h2>
<button hx-get="/about" hx-target="#about" hx-swap="innerHTML"
  class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">About</button>
<div id="about">
  About
</div>
{% endblock %}
